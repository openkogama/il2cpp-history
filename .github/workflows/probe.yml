name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        build:
          - 8f1df9ebe6ffea7a872cbb5bbd1efae306d3eea78a0c779fade074e0aaafcba6
    env:
      GHIDRA_INSTALL_DIR: ${{ github.workspace }}/tools/ghidra_12.1.4_PUBLIC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          nproc; free -h
          curl -sL -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          curl -sL -o redux.zip https://github.com/LukeFZ/Il2CppInspectorRedux/releases/download/2026.2/Il2CppInspectorRedux.CLI-linux-x64.zip
          unzip -q ghidra.zip -d tools
          unzip -q redux.zip -d tools/redux
          chmod +x tools/redux/*/Il2CppInspector.Redux.CLI
          pip install --find-links "$GHIDRA_INSTALL_DIR"/Ghidra/Features/PyGhidra/pypkg/dist pyghidra
      - run: python fetch.py ${{ matrix.build }} in
      - run: |
          unity=$(python -c "import json;print(json.load(open('in/build.json'))['unityVersion'])")
          timeout 600 /usr/bin/time -v tools/redux/*/Il2CppInspector.Redux.CLI process in/GameAssembly.dll in/global-metadata.dat \
            -o out -s --layout class -m --disassembler Ghidra --unity-version "$unity" < /dev/null 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' || echo "redux exit $?"
          find out -maxdepth 3 | head -60 || true
          du -sh out/* || true
      - run: |
          py=$(find out -maxdepth 2 -name '*.py' | head -1)
          echo "script: $py"
          timeout 3600 /usr/bin/time -v python -c "import pyghidra; pyghidra.run_script('in/GameAssembly.dll', 'ghidra.py', project_location='/tmp/proj', project_name='p', script_args=['$py', 'out/ghidra', 'MVNetworkGame'], analyze=False)" < /dev/null 2>&1
          head -c 6000 out/ghidra/sample.c || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.build }}
          path: |
            out/ghidra/
            out/**/*.py
            out/**/*.json
