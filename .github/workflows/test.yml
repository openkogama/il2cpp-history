name: test

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        build:
          - 3d4af3cc13199af62e17b9a730da182bfdf985af9efe464577c5f5042f326a5d
          - b90a4253216e8d6d539efa4da99f3a38a668c62c9045c6cce165c0a13515929b
          - 2e6f2bf1268a5d93bffe487c174a95a4c7a0b17b28ba492d75f3073e24dccab8
    env:
      GHIDRA_INSTALL_DIR: ${{ github.workspace }}/tools/ghidra_12.1.4_PUBLIC
      DECOMPILE_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          curl -sL -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          curl -sL -o inspector.zip https://github.com/LukeFZ/Il2CppInspectorRedux/releases/download/2026.2/Il2CppInspectorRedux.Legacy.CLI-linux-x64.zip
          unzip -q ghidra.zip -d tools
          unzip -q inspector.zip -d tools/inspector
          chmod +x tools/inspector/*/Il2CppInspector
          pip install --find-links "$GHIDRA_INSTALL_DIR"/Ghidra/Features/PyGhidra/pypkg/dist pyghidra
      - run: python fetch.py ${{ matrix.build }} in
      - run: |
          unity=$(python -c "import json;print(json.load(open('in/build.json'))['unityVersion'])")
          timeout 900 tools/inspector/*/Il2CppInspector -i in/GameAssembly.dll -m in/global-metadata.dat \
            --select-outputs -c out/cs -l tree -n -p out/il2cpp.py -t Ghidra -o out/metadata.json -h out/cpp \
            --unity-version "$unity" < /dev/null 2>&1 | tail -5
      - run: |
          timeout 19800 /usr/bin/time -v python -c "import os, pyghidra; w=os.getcwd(); pyghidra.run_script(w+'/in/GameAssembly.dll', w+'/decompile.py', project_location='/tmp/proj', project_name='p', script_args=[w+'/out/il2cpp.py', w+'/out/src'], analyze=False)" < /dev/null 2>&1
          cp in/build.json out/src/
          du -sh out/src; find out/src -name '*.c' | wc -l
      - if: always()
        run: tar czf src.tar.gz -C out src cs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: src-${{ matrix.build }}
          path: src.tar.gz
