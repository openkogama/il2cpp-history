name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build:
          - 8f1df9ebe6ffea7a872cbb5bbd1efae306d3eea78a0c779fade074e0aaafcba6
          - b98f6772b1da3e1698dcd2239928a2c992f2a002244e9239fd91661e46c82775
          - 24018d1358c41540b349847ba038d3441d657c773a5a6336abbb7a022fee9c8d
          - f9bdd686888f66197752ec3d97335274f897e3e0a94d6c562b22a10928ff6e6c
          - 1af46831847a906ced85060f828f891b0c0831e68d80859f3128c55c8ff2001d
    env:
      GHIDRA_INSTALL_DIR: ${{ github.workspace }}/tools/ghidra_12.1.4_PUBLIC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          curl -sL -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          curl -sL -o inspector.zip https://github.com/LukeFZ/Il2CppInspectorRedux/releases/download/2026.2/Il2CppInspectorRedux.Legacy.CLI-linux-x64.zip
          unzip -q ghidra.zip -d tools
          unzip -q inspector.zip -d tools/inspector
          chmod +x tools/inspector/*/Il2CppInspector
          pip install --find-links "$GHIDRA_INSTALL_DIR"/Ghidra/Features/PyGhidra/pypkg/dist pyghidra
      - run: python fetch.py ${{ matrix.build }} in
      - run: |
          unity=$(python -c "import json;print(json.load(open('in/build.json'))['unityVersion'])")
          timeout 900 /usr/bin/time -v tools/inspector/*/Il2CppInspector -i in/GameAssembly.dll -m in/global-metadata.dat \
            --select-outputs -c out/cs -l tree -n -p out/il2cpp.py -t Ghidra -o out/metadata.json -h out/cpp \
            --unity-version "$unity" < /dev/null 2>&1
          find out -maxdepth 3 | head -40
          du -sh out/*
      - run: |
          timeout 3600 /usr/bin/time -v python -c "import os, pyghidra; w=os.getcwd(); pyghidra.run_script(w+'/in/GameAssembly.dll', w+'/decompile.py', project_location='/tmp/proj', project_name='p', script_args=[w+'/out/il2cpp.py', w+'/out/ghidra', 'MVNetworkGame'], verbose=True, analyze=False)" < /dev/null 2>&1
          head -c 8000 out/ghidra/sample.c
      - if: always()
        run: tar czf probe.tar.gz out/ghidra out/cs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.build }}
          path: probe.tar.gz
